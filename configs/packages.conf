# ============================================================
# Dataset Package Configuration
# ============================================================
#
# OPTIMIZATION LEVELS:
#   Set OPT_LEVELS below to control which optimizations to compile.
#   More levels = more training data (4x with all four).
#   Default: O2 only (matching prior runs).
#   Recommended: O0 O1 O2 O3 (for publication-quality dataset).
#
# PLATFORMS:
#   Set PLATFORMS below to control target platforms.
#   "linux" = native ELF (always works)
#   "windows" = PE via MinGW cross-compiler (requires mingw-w64)
#   Default: linux only.
#
# PACKAGE FORMAT:
#   name | url | tarball | src_dir | bin1 bin2 bin3 ...
#
# Lines starting with # are comments.
# Lines starting with [DEMO] are excluded from training.
# Lines starting with [LINUX_ONLY] skip Windows cross-compilation.
# ============================================================

# ── BUILD SETTINGS ──────────────────────────────────────────
# Uncomment the desired configuration:

# Minimal (fast, single optimization):
# OPT_LEVELS=O2

# Standard (balanced):
# OPT_LEVELS=O0 O2

# Full cross-optimization:
OPT_LEVELS=O0 O1 O2 O3

# Platforms (linux is always included):
PLATFORMS=linux
# PLATFORMS=linux windows

